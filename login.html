<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login | VYRON Gaming </title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/all.css" />

</head>

<body>
    <!-- /////////////////////////////////////////////////////////////////////////////////////////// -->
    <header>
        <div class="container">

            <div class="header-content">
                <a href="index.html" class="brand">
                    <img src="Images/VYRON-GAME.png" width="250px" height="85" alt="">
                </a>
                <nav>
                    <ul>
                        <li><a href="login.html" class="hid-auth-link">Sing in</a></li>
                        <li><a href="register.html" class="hid-auth-link">Sign up</a></li>
                    </ul>
                </nav>
            </div>

        </div>
    </header>
    <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->

    <section class="section-form  section2">
        <!-- <h2>Login User</h2> -->
        <form>
            <div class="fromgroup1 group1 ">
                <label for="Email">Email</label>
                <input type="email" placeholder="Enter email" id="email">
            </div>

            <div class="fromgroup1 group2 ">
                <label for="Password">Password</label>
                <input type="password" placeholder="Enter password" id="password">
            </div>

            <div class="Remembr">
                <label class="check">
                    <input type="checkbox">
                    <span>Remember Me</span>
                </label>
            </div>


            <input type="submit" value="login" class="login">


            <div class="from-span">

                <span> Not Have An Account?</span><a href="register.html">Register</a>
            </div>
        </form>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
